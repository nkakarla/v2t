# Included by both v2t.eperflabs.com vhosts: /api/ goes to the web converter (webapp.py, deploy/v2t.service).
ProxyPreserveHost On
ProxyTimeout 300
ProxyPass        /api/ http://127.0.0.1:8850/api/
ProxyPassReverse /api/ http://127.0.0.1:8850/api/
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
# The main eperflabs.com vhost injects an Authorization header for another app; keep it out.
RequestHeader unset Authorization
# The app caps uploads at 300 MB; leave room for the form wrapper so the app (not Apache) explains the limit.
LimitRequestBody 330000000
<Location /api/>
    Header set Cache-Control "no-store"
</Location>
