# V2T page: static files served straight from the repo checkout; /api/ proxied to the web converter.
# certbot --apache -d v2t.eperflabs.com adds the HTTPS twin (v2t.eperflabs.com-le-ssl.conf) and the redirect.
<VirtualHost *:80>
    ServerName v2t.eperflabs.com
    DocumentRoot /home/nash-mudi/Documents/projects/v2t/web

    <Directory /home/nash-mudi/Documents/projects/v2t/web>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # always download the installer, never try to display it; release info must never be stale
    <FilesMatch "\.exe$">
        Header set Content-Disposition "attachment"
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <Files "latest.json">
        Header set Cache-Control "no-store"
    </Files>

    Include /home/nash-mudi/Documents/projects/v2t/deploy/v2t-api.conf

    ErrorLog ${APACHE_LOG_DIR}/v2t-error.log
    CustomLog ${APACHE_LOG_DIR}/v2t-access.log combined
</VirtualHost>
